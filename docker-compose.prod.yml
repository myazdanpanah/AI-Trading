# ══════════════════════════════════════════════════════════════════════
# Production Docker Compose
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ══════════════════════════════════════════════════════════════════════

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    command: gunicorn crypto_platform.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120
    volumes:
      - static_files:/app/staticfiles
      - log_data:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=crypto_platform.settings.production
      - DEBUG=False
      - AI_MODE=standard
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
    volumes: []
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    profiles: ["nginx-proxy"]  # Only if using nginx as reverse proxy

  postgres:
    ports: []  # Don't expose to host in production
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=4MB
        -c maintenance_work_mem=128MB
        -c max_connections=100
    restart: unless-stopped

  redis:
    ports: []  # Don't expose to host in production
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    command: celery -A crypto_platform worker -l info --concurrency=4
    volumes:
      - log_data:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=crypto_platform.settings.production
      - AI_MODE=standard
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    command: celery -A crypto_platform beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - log_data:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=crypto_platform.settings.production
    restart: unless-stopped

  ollama:
    ports: []  # Don't expose to host in production
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  prometheus:
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  static_files:
  log_data:
  postgres_data:
  redis_data:
  ollama_data:
  prometheus_data:
  grafana_data:
