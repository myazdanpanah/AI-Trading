# Production Docker Compose Override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    command: gunicorn crypto_platform.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120
    volumes:
      - static_files:/app/staticfiles
    environment:
      - DJANGO_SETTINGS_MODULE=crypto_platform.settings.production
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:80

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    volumes: []

  nginx:
    volumes:
      - static_files:/app/staticfiles:ro

  postgres:
    ports: []  # Don't expose to host in production

  redis:
    ports: []  # Don't expose to host in production

volumes:
  static_files:
